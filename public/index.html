<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS AI</title>
<style>
:root{--bg:#05080d;--panel:#0d141b;--line:#1e2d38;--text:#eef7ff;--muted:#7890a0;--cyan:#45d8ff;--green:#38e59a;--red:#ff5f72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow:hidden}
.app{max-width:760px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 8px);background:radial-gradient(circle at 50% -8%,rgba(41,140,181,.22),transparent 34%),linear-gradient(180deg,#070b11,#05080d)}
header{display:flex;align-items:center;justify-content:space-between;min-height:68px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center}.orb{width:44px;height:44px;border-radius:50%;border:1px solid var(--cyan);position:relative;box-shadow:0 0 20px #45d8ff33}
.orb:before{content:"";position:absolute;inset:8px;border:1px solid #45d8ffaa;border-radius:50%;animation:pulse 2.2s infinite}.orb:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cyan);left:17px;top:17px;box-shadow:0 0 14px var(--cyan)}
h1{margin:0;font-size:18px;letter-spacing:4px}.online{font-size:11px;color:var(--muted);margin-top:4px}.online b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:5px}
#chat{flex:1;overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.user{align-self:flex-start;background:#123047;border-bottom-left-radius:5px}.ai{align-self:flex-end;background:#101820;border:1px solid #1d2b36;border-bottom-right-radius:5px}
.welcome{text-align:center;color:var(--muted);margin:auto}.welcome h2{color:var(--text);font-size:20px;margin:10px 0 5px}.bigorb{width:86px;height:86px;margin:auto}
.live-entry{display:flex;justify-content:center;padding:7px 0 3px}.live-entry button{border:1px solid #23566e;background:linear-gradient(180deg,#10364a,#0a2432);color:#dff8ff;border-radius:22px;padding:10px 18px;font-weight:700;letter-spacing:1px;box-shadow:0 0 20px #45d8ff18}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px #ff5f72;margin-left:7px}
.quick{display:flex;gap:7px;overflow-x:auto;padding:5px 0}.quick button{flex:0 0 auto;border:1px solid var(--line);background:#0a1118;color:#9eb4c5;border-radius:18px;padding:8px 12px;font-size:12px}
form{display:flex;gap:8px;align-items:center;padding:7px 0 3px}input{flex:1;min-width:0;background:#0b1219;border:1px solid #1c2b36;color:white;border-radius:24px;padding:13px 16px;font-size:16px;outline:none}
button.send,button.icon{width:46px;height:46px;border-radius:50%;border:1px solid #223441;color:#eef7ff;font-size:18px}.send{background:#12384d}.icon{background:#0a1219}.status{text-align:center;color:#536b7b;font-size:10px;min-height:16px}
.live-panel{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 28%,#0d2b3a 0,#071018 36%,#030608 78%);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.live-panel.show{display:flex}.live-box{width:min(100%,520px);text-align:center;position:relative}.live-close{position:absolute;left:0;top:-60px;width:44px;height:44px;border-radius:50%;border:1px solid #263742;background:#0c141b;color:#cbd8e0;font-size:24px}
.live-orb{width:180px;height:180px;border-radius:50%;margin:0 auto 28px;border:1px solid #45d8ff;position:relative;box-shadow:0 0 70px #45d8ff33,inset 0 0 45px #45d8ff18;transition:transform .08s ease,box-shadow .2s ease}
.live-orb:before{content:"";position:absolute;inset:20px;border-radius:50%;border:1px solid #45d8ff99}.live-orb:after{content:"";position:absolute;inset:67px;border-radius:50%;background:#45d8ff;box-shadow:0 0 45px #45d8ff}
.live-orb.thinking{animation:spinPulse 1.3s infinite}.live-orb.speaking{box-shadow:0 0 100px #38e59a55,inset 0 0 55px #38e59a22;border-color:#38e59a}
.live-box h2{font-size:28px;letter-spacing:5px;margin:0 0 10px}.live-state{color:#9bb0be;font-size:15px;min-height:24px}.live-last{min-height:48px;margin:18px auto;color:#d9e9f2;font-size:15px;line-height:1.7;max-width:420px}
.live-main{border:1px solid #27607a;background:#10364a;color:white;border-radius:28px;padding:13px 24px;font-size:16px;min-width:150px}.live-main.end{background:#3a1118;border-color:#7c2635}
.live-note{color:#607786;font-size:11px;margin-top:16px}
@keyframes pulse{50%{transform:scale(1.16);opacity:.45}}@keyframes spinPulse{50%{transform:scale(1.05);box-shadow:0 0 95px #45d8ff55,inset 0 0 55px #45d8ff22}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="orb"></div><div><h1>JARVIS</h1><div class="online"><b></b> Workers AI Online</div></div></div><div style="display:flex;gap:8px"><button id="speaker" class="icon" type="button">🔊</button><button id="clear" class="icon" type="button">⌫</button></div></header>
<section id="chat"><div class="welcome" id="welcome"><div class="orb bigorb"></div><h2>سڵاو، من JARVIS ـم.</h2><div>فەرمانەکەت بنووسە یان Live Voice بەکاربهێنە.</div></div></section>
<div class="live-entry"><button id="liveOpen"><span class="live-dot"></span> JARVIS LIVE</button></div>
<section class="quick">
<button data-p="تۆ چی دەتوانیت بۆ من بکەیت؟">تواناکانت</button>
<button data-p="یارمەتیم بدە project ـێکی نوێ پلان بکەم.">Project</button>
<button data-p="Database ـێکی باش بۆ سیستەمی فرۆشتن پلان بکە.">Database</button>
<button data-p="نمونەی کۆدێکی پاک و ڕێکخراو بۆم بنووسە.">Code</button>
</section>
<form id="composer"><button id="mic" class="icon" type="button">🎙️</button><input id="message" placeholder="فەرمانەکەت بنووسە..." autocomplete="off"><button class="send" type="submit">➤</button></form>
<div id="status" class="status">JARVIS ئامادەیە</div>
</main>

<section id="livePanel" class="live-panel" aria-hidden="true">
  <div class="live-box">
    <button id="liveClose" class="live-close" type="button">×</button>
    <div id="liveOrb" class="live-orb"></div>
    <h2>JARVIS LIVE</h2>
    <div id="liveState" class="live-state">ئامادەیە بۆ قسەکردن</div>
    <div id="liveLast" class="live-last">دوگمەی خوارەوە دابگرە، پاشان ڕاستەوخۆ قسە بکە.</div>
    <button id="liveMain" class="live-main" type="button">دەستپێکردن</button>
    <div class="live-note">لە یەکەم جاردا Safari مۆڵەتی Microphone داوا دەکات — Allow بکە.</div>
  </div>
</section>

<script src="/chat.js"></script>
</body>
</html>
